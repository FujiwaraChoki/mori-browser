[package]
name = "mori"
description = "Mori browser: a GPUI chrome around Chromium."
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "mori"
path = "src/main.rs"

[dependencies]
mori-core.workspace = true
mori-engine.workspace = true
gpui-kit.workspace = true
anyhow.workspace = true
log.workspace = true
env_logger.workspace = true
serde.workspace = true
serde_json.workspace = true
url.workspace = true
uuid.workspace = true
smallvec.workspace = true
dirs.workspace = true
image = { version = "0.25", default-features = false, features = ["png"] }
# Assistant: Codex app-server client (localhost WebSocket, no TLS).
futures = "0.3"
libc = "0.2"
tungstenite = { version = "0.28", default-features = false, features = ["handshake"] }
# Launcher search suggestions (blocking GET on a background thread).
ureq = { version = "3", default-features = false, features = ["rustls", "gzip"] }

[dependencies.cef-dll-sys]
workspace = true
