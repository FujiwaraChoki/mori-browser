[package]
name = "mori-core"
description = "Mori browser state, persistence, and product logic (no UI, no engine)."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
log.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["float_roundtrip"] }
url.workspace = true
uuid.workspace = true
dirs.workspace = true
# Built-in ad and tracker blocking (Brave's engine). Without the default
# `single-thread` feature the engine is Send + Sync for the network thread.
adblock = { version = "0.13", default-features = false, features = ["embedded-domain-resolver", "full-regex-handling"] }
# Registrable domains (public suffix list) for grouping cookies by site.
addr = { version = "0.15", default-features = false, features = ["psl"] }
# Passwords: wiping secrets from memory, and the generator's random source.
zeroize = "1"
getrandom = "0.4"
rusqlite = { version = "0.40.2", features = ["bundled"] }
lz4_flex = { version = "0.14.0", default-features = false, features = ["std", "safe-decode", "safe-encode", "checked-decode"] }
# Chrome-family cookie values: PBKDF2-HMAC-SHA1 and AES-128-CBC.
aes = "0.8.4"
pbkdf2 = { version = "0.12.2", default-features = false, features = ["hmac"] }
sha1 = "0.10.6"

[target.'cfg(target_os = "linux")'.dependencies]
# The other browser's cookie password, from the Secret Service keyring.
secret-service = { version = "5.2", default-features = false, features = ["rt-async-io-crypto-rust"] }
