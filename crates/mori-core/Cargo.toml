[package]
name = "mori-core"
description = "Mori browser state, persistence, and product logic (no UI, no engine)."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
log.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["float_roundtrip"] }
url.workspace = true
uuid.workspace = true
dirs.workspace = true
rusqlite = { version = "0.40.2", features = ["bundled"] }
lz4_flex = { version = "0.14.0", default-features = false, features = ["std", "safe-decode", "safe-encode", "checked-decode"] }
